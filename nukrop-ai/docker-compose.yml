version: '3.8'

services:
  nukrop-ai-backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FIREBASE_ADMIN_CREDENTIALS={"type":"service_account"...} # Replace with yours
      - HUGGINGFACE_API_KEY=your_hf_token
      - GEMINI_API_KEY=your_gemini_token
    volumes:
      - ./backend/app:/app/app
    restart: always