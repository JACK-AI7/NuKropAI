function renderCarouselSlide(container, config) {
  NuKropAnalytics.track('onboarding_slide_' + config.activeDot);

  const slideScreens = [
    'slide_disease',
    'slide_haul',
    'slide_community'
  ];

  let dotsHtml = '';
  const totalDots = 3;
  for (let i = 0; i < totalDots; i++) {
    const isActive = i === config.activeDot;
    dotsHtml += `
      <div onclick="advanceSlide('${slideScreens[i]}')" style="height:7px;border-radius:10px;background:${isActive ? '#16A34A' : '#E2E8F0'};cursor:pointer;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);width:${isActive ? '24px' : '7px'};"></div>
    `;
  }

  const isLastSlide = config.activeDot === (totalDots - 1);
  const nextTarget = isLastSlide ? 'skipToPermissions()' : `advanceSlide('${config.nextScreen}')`;
  const buttonText = isLastSlide ? (typeof OB_TL === 'function' ? OB_TL('continue') : 'Continue') : (typeof OB_TL === 'function' ? OB_TL('next') : 'Next');

  container.innerHTML = `
    <div style="width:100%;height:100%;display:flex;flex-direction:column;box-sizing:border-box;background:#F8FAF8;position:relative;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;">

      <!-- Top 58% (Illustrated Hero Canvas) -->
